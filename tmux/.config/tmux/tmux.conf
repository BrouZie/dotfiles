unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "IKKE SNAKK!"

# Options
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"  # true color support
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window

# Make modifier keys unique
set -g extended-keys on
set -as terminal-features ',*:extkeys'

# Allow image rendering + lets Omarchy's theme-switch OSC sequences reach panes
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

# Change prefix
unbind C-b
set -g prefix C-space

bind-key C-b send-prefix

# Theme: status
# Colors reference the terminal's own ANSI palette (default/black/blue/brightblack/red).
# Omarchy repaints that palette live via OSC sequences on theme switch
# (omarchy-theme-set-tmux) — no per-theme tmux file needed, same as Omarchy's stock conf.
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=default]#{s|$HOME|~|:pane_current_path}#[default]"
set -g status-position bottom
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme: borders
set -g pane-border-lines single
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

# Theme: windows
set -g window-status-style "fg=brightblack,bg=default"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=blue,bg=default,bold"
set -g window-status-bell-style "fg=red,nobold"
set -g status-justify "absolute-centre"

# Theme: messages
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"

# Theme: copy mode (vi)
set -g mode-keys vi
set -g status-keys vi
set -g mode-style "bg=blue,fg=black"

unbind v   # horizontal split
unbind s   # vertical split
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Seamless pane <-> vim split navigation (inlined so it works even if TPM/plugins
# fail to load; nvim's christoomey/vim-tmux-navigator plugin hands the keystroke
# back to tmux once nvim runs out of splits in that direction)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Switch windows
bind -n M-. next-window
bind -n M-, previous-window

bind-key -n M-q kill-pane

# ─── Ported from Omarchy's default tmux.conf (non-conflicting extras) ────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# ─── New window & rename ──────────────────────────────────────────────────
unbind Enter
unbind %
bind Enter new-window -c "#{pane_current_path}"
bind % command-prompt "rename-window '%%'"

# ─── Copy to clipboard and stuff ──────────────────────────────────────────
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T prefix Escape copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

bind-key E run-shell 'nohup nautilus "#{pane_current_path}" >/dev/null 2>&1 &'

# ─── Plugins (via TPM) ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @sessionx-bind 'p'
set -g @sessionx-filter-current 'false' # let me see current session
set -g @sessionx-bind-select-up 'ctrl-p'
set -g @sessionx-bind-select-down 'ctrl-n'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# ─── Not yet set up on this machine — scripts missing, keybinds commented out ──
# bind-key i run-shell "tmux neww sokratos-cheat-sheet" NOTE: script removed
# bind-key n run-shell "tmux neww braincreate-tmux"
bind-key G run-shell "github-tmux"
# bind-key t run-shell "tmux neww session-toggle"

# Direct shortcuts to important directories
bind-key f run-shell "tmux neww sokratos-quick-search"
bind-key T run-shell "tmux neww sokratos-quick-search ~/Documents/2ndBrain"
bind-key H run-shell "tmux neww sokratos-quick-search ~/.config/hypr"
bind-key N run-shell "tmux neww sokratos-quick-search ~/.config/nvim"
# bind-key S run-shell "tmux neww sokratos-quick-search ~/.local/share/sokratOS"
bind-key B run-shell "tmux neww sokratos-quick-search ~/.local/bin"

# bind -n M-v split-window -h "bash -c ros-jazzy-tmux"
# bind -n M-s split-window -v "bash -c ros-jazzy-tmux"
# bind -n M-Enter new-window "bash -c ros-jazzy-tmux"

# ─── Bootstrap TPM (keep this last!) ──────────────────────────────────────
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
